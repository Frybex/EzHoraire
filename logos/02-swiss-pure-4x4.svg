<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <rect width="360" height="360" fill="#FFFFFF" />
  <g transform="translate(40, 40)">
    <!-- 4x4 Cells of 70x70 = 280x280 total -->
    <!-- E shape in red and blue -->
    <rect x="0" y="0" width="70" height="70" fill="#2456e0" />
    <rect x="70" y="0" width="70" height="70" fill="#2456e0" />
    <rect x="0" y="70" width="70" height="70" fill="#2456e0" />
    
    <!-- E middle bar touching Z top bar -->
    <rect x="0" y="140" width="70" height="70" fill="#E11D48" />
    <rect x="70" y="140" width="70" height="70" fill="#E11D48" />
    <rect x="140" y="70" width="70" height="70" fill="#E11D48" />
    <rect x="210" y="70" width="70" height="70" fill="#18181B" />
    
    <!-- Z diagonal & E bottom bar connected -->
    <polygon points="210,70 280,70 140,210 140,140" fill="#18181B" />
    <polygon points="210,140 280,140 140,280 70,280" fill="#2456e0" />
    
    <!-- E bottom bar -->
    <rect x="0" y="210" width="70" height="70" fill="#2456e0" />
    <rect x="0" y="210" width="70" height="70" fill="#2456e0" />
    <rect x="70" y="210" width="70" height="70" fill="#E11D48" />
    
    <!-- Z bottom bar -->
    <rect x="140" y="210" width="70" height="70" fill="#2456e0" />
    <rect x="210" y="210" width="70" height="70" fill="#18181B" />

    <!-- Grid lines -->
    <!-- Outer frame -->
    <rect x="0" y="0" width="280" height="280" fill="none" stroke="#18181B" stroke-width="4" />
    <!-- Inner lines -->
    <line x1="70" y1="0" x2="70" y2="280" stroke="#18181B" stroke-width="2.5" />
    <line x1="140" y1="0" x2="140" y2="280" stroke="#18181B" stroke-width="2.5" />
    <line x1="210" y1="0" x2="210" y2="280" stroke="#18181B" stroke-width="2.5" />
    
    <line x1="0" y1="70" x2="280" y2="70" stroke="#18181B" stroke-width="2.5" />
    <line x1="0" y1="140" x2="280" y2="140" stroke="#18181B" stroke-width="2.5" />
    <line x1="0" y1="210" x2="280" y2="210" stroke="#18181B" stroke-width="2.5" />
  </g>
</svg>