<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <g>
    <!-- Barre haute pleine largeur (Blanc) -->
    <rect x="16" y="22" width="68" height="12" rx="3" fill="#f4f5f7" />
    <!-- Diagonale du Z (Accent) reliant haut droit au milieu bas -->
    <polygon points="72,34 84,34 52,66 40,66" fill="#4cc38a" />
    <!-- Barre médiane du E (Accent) rejoignant la diagonale -->
    <polygon points="16,44 62,44 50,56 16,56" fill="#4cc38a" />
    <!-- Pied du E à gauche (Blanc) -->
    <rect x="16" y="66" width="16" height="12" rx="3" fill="#f4f5f7" />
    <!-- Barre du Z en bas : s'arrête à la moitié ! (x=40 à 84) (Blanc) -->
    <rect x="40" y="66" width="44" height="12" rx="3" fill="#f4f5f7" />
  </g>
</svg>