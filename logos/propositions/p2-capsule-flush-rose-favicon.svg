<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232832"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#t)"/>
  <g>
    <!-- Barre haute arrondie (Blanc) -->
    <rect x="16" y="22" width="68" height="12" rx="6" fill="#f4f5f7" />
    <!-- Diagonale du Z (Accent) - S'arrête exactement à la moitié en bas (x=40..52) -->
    <polygon points="72,34 84,34 52,66 40,66" fill="#ffa8d0" />
    <!-- Barre centrale du E (Accent) - Capsule gauche, contact net sur la diagonale -->
    <path d="M 22 44 L 62 44 L 50 56 L 22 56 A 6 6 0 0 1 16 50 A 6 6 0 0 1 22 44 Z" fill="#ffa8d0" />
    <!-- Barre basse arrondie (Blanc) -->
    <rect x="16" y="66" width="68" height="12" rx="6" fill="#f4f5f7" />
  </g>
</svg>