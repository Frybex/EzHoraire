<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232832"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#t)"/>
  <g>
    <!-- Cadre extérieur d'accent (comme sur votre croquis Paint) -->
    <rect x="12" y="12" width="76" height="76" rx="6" fill="none" stroke="#ffa8d0" stroke-width="2.5" />
    <!-- Barre haute pleine largeur intérieure (Blanc) -->
    <rect x="17" y="20" width="66" height="10" rx="1.5" fill="#f4f5f7" />
    <!-- Diagonale du Z + Barre centrale du E (Même couleur Accent, arrêt net au centre bas) -->
    <polygon points="17,45 60,45 70,30 80,30 50,70 40,70 50,55 17,55" fill="#ffa8d0" />
    <!-- Barre basse pleine largeur intérieure (Blanc) -->
    <rect x="17" y="70" width="66" height="10" rx="1.5" fill="#f4f5f7" />
  </g>
</svg>