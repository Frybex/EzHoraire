<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <g>
    <!-- Barre haute arrondie (Blanc) -->
    <rect x="16" y="22" width="68" height="12" rx="6" fill="#f4f5f7" />
    <!-- Diagonale du Z (Accent) - S'arrête exactement à la moitié en bas (x=40..52) -->
    <polygon points="72,34 84,34 52,66 40,66" fill="#5b86ff" />
    <!-- Barre centrale du E (Accent) - Capsule gauche, contact net sur la diagonale -->
    <path d="M 22 44 L 62 44 L 50 56 L 22 56 A 6 6 0 0 1 16 50 A 6 6 0 0 1 22 44 Z" fill="#5b86ff" />
    <!-- Barre basse arrondie (Blanc) -->
    <rect x="16" y="66" width="68" height="12" rx="6" fill="#f4f5f7" />
  </g>
</svg>