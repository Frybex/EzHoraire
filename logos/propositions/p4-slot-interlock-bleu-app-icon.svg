<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232832"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <radialGradient id="h" cx=".26" cy=".08" r=".9">
      <stop offset="0" stop-color="#5b86ff33"/>
      <stop offset="1" stop-color="#5b86ff33" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.2)"/>
      <stop offset=".45" stop-color="rgba(255,255,255,.03)"/>
      <stop offset="1" stop-color="rgba(0,0,0,.4)"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="100" height="100" rx="22" fill="url(#t)"/>
  <rect width="100" height="100" rx="22" fill="url(#h)"/>
  <!-- Subtle timetable grid lines -->
  <g clip-path="url(#c)" stroke="rgba(255,255,255,.07)" stroke-width="1">
    <path d="M0 28H100"/><path d="M0 44H100"/><path d="M0 60H100"/><path d="M0 76H100"/>
    <path d="M28 0V100"/><path d="M50 0V100"/><path d="M72 0V100"/>
  </g>
  <!-- Inner Glyph -->
  <!-- Prop 4: Timetable Interlock Slot -->
  <g>
    <!-- Top bar -->
    <rect x="16" y="22" width="68" height="12" rx="4" fill="#f4f5f7" />
    <!-- Bottom bar -->
    <rect x="16" y="66" width="68" height="12" rx="4" fill="#f4f5f7" />
    <!-- Diagonal segment (with precision slot) -->
    <path d="M 76 34 L 84 34 L 57 56 L 57 56 L 76 34" fill="#f4f5f7" opacity="0.95" />
    <polygon points="78,34 84,34 30,66 24,66" fill="#f4f5f7" />
    <!-- Central horizontal slot (Accent) extending to touch the diagonal with a 2px micro-gap rhythm -->
    <rect x="16" y="44" width="33" height="12" rx="4" fill="#5b86ff" />
    <circle cx="53" cy="50" r="3" fill="#5b86ff" />
  </g>
  <!-- Subtle border highlight -->
  <rect x=".5" y=".5" width="99" height="99" rx="21.5" fill="none" stroke="url(#borderGrad)"/>
</svg>