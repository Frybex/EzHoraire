<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232832"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <radialGradient id="h" cx=".26" cy=".08" r=".9">
      <stop offset="0" stop-color="#4cc38a33"/>
      <stop offset="1" stop-color="#4cc38a33" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.2)"/>
      <stop offset=".45" stop-color="rgba(255,255,255,.03)"/>
      <stop offset="1" stop-color="rgba(0,0,0,.4)"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="100" height="100" rx="22" fill="url(#t)"/>
  <rect width="100" height="100" rx="22" fill="url(#h)"/>
  <!-- Subtle timetable grid lines -->
  <g clip-path="url(#c)" stroke="rgba(255,255,255,.07)" stroke-width="1">
    <path d="M0 28H100"/><path d="M0 44H100"/><path d="M0 60H100"/><path d="M0 76H100"/>
    <path d="M28 0V100"/><path d="M50 0V100"/><path d="M72 0V100"/>
  </g>
  <!-- Inner Glyph -->
  <!-- Prop 1: Soft Pill Flow -->
  <g>
    <!-- Top full bar -->
    <rect x="16" y="22" width="68" height="12" rx="6" fill="#f4f5f7" />
    <!-- Diagonal stroke of Z -->
    <path d="M 73.5 25 L 26.5 75" stroke="#f4f5f7" stroke-width="12" stroke-linecap="round" />
    <!-- Bottom full bar -->
    <rect x="16" y="66" width="68" height="12" rx="6" fill="#f4f5f7" />
    <!-- Middle bar of E: touching and flowing into the diagonal, highlighted in accent -->
    <path d="M 22 44 L 46 44 A 6 6 0 0 1 50 56 L 22 56 A 6 6 0 0 1 16 50 A 6 6 0 0 1 22 44 Z" fill="#4cc38a" />
    <!-- Subtle junction pill cap in accent color -->
    <circle cx="22" cy="50" r="6" fill="#4cc38a" />
  </g>
  <!-- Subtle border highlight -->
  <rect x=".5" y=".5" width="99" height="99" rx="21.5" fill="none" stroke="url(#borderGrad)"/>
</svg>