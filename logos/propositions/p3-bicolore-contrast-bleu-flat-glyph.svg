<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Prop 3: Bicolore E / Z High Contrast -->
  <g>
    <!-- Top bar of Z & E (White) -->
    <rect x="16" y="22" width="68" height="12" rx="3" fill="#f4f5f7" />
    <!-- Bottom bar of Z & E (White) -->
    <rect x="16" y="66" width="68" height="12" rx="3" fill="#f4f5f7" />
    <!-- Diagonal of Z (White) -->
    <polygon points="76,34 84,34 32,66 24,66" fill="#f4f5f7" />
    <!-- Central E bar (Vibrant Theme Accent) locking into the center of the Z -->
    <rect x="16" y="44" width="37" height="12" rx="3" fill="#5b86ff" />
    <path d="M 50 44 L 56 50 L 50 56 Z" fill="#5b86ff" />
  </g>
</svg>