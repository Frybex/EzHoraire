<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232832"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <radialGradient id="h" cx=".26" cy=".08" r=".9">
      <stop offset="0" stop-color="#ffa8d033"/>
      <stop offset="1" stop-color="#ffa8d033" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,.2)"/>
      <stop offset=".45" stop-color="rgba(255,255,255,.03)"/>
      <stop offset="1" stop-color="rgba(0,0,0,.4)"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="100" height="100" rx="22" fill="url(#t)"/>
  <rect width="100" height="100" rx="22" fill="url(#h)"/>
  <!-- Subtle timetable grid lines -->
  <g clip-path="url(#c)" stroke="rgba(255,255,255,.07)" stroke-width="1">
    <path d="M0 28H100"/><path d="M0 44H100"/><path d="M0 60H100"/><path d="M0 76H100"/>
    <path d="M28 0V100"/><path d="M50 0V100"/><path d="M72 0V100"/>
  </g>
  <!-- Inner Glyph -->
  <!-- Prop 5: Monogramme Carré Encadré (Croquis Paint Fidèle) -->
  <g>
    <!-- Square outer boundary frame (like user's red sketch frame) -->
    <rect x="14" y="14" width="72" height="72" rx="6" fill="none" stroke="#ffa8d0" stroke-width="3" />
    <!-- Top bar touching frame width -->
    <rect x="20" y="23" width="60" height="10" rx="3" fill="#f4f5f7" />
    <!-- Bottom bar touching frame width -->
    <rect x="20" y="67" width="60" height="10" rx="3" fill="#f4f5f7" />
    <!-- Z Diagonal -->
    <polygon points="74,33 80,33 26,67 20,67" fill="#f4f5f7" />
    <!-- E Middle bar in accent touching the diagonal -->
    <rect x="20" y="45" width="32" height="10" rx="3" fill="#ffa8d0" />
  </g>
  <!-- Subtle border highlight -->
  <rect x=".5" y=".5" width="99" height="99" rx="21.5" fill="none" stroke="url(#borderGrad)"/>
</svg>