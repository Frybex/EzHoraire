<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<title>EzHoraire — Dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
/* Apparence choisie dans l'app (Clair / Sombre / Système) : pas d'éclair. */
try { var _a = localStorage.getItem("ezh_apparence"); document.documentElement.setAttribute("data-apparence", (_a === "clair" || _a === "sombre") ? _a : "systeme"); }
catch (e) { document.documentElement.setAttribute("data-apparence", "systeme"); }
</script>
<style>
  :root {
    --bg: #f4f5f7; --surface: #fff; --ink: #17191d; --muted: #626977;
    --line: #e4e7ec; --accent: #2456e0; --accent-soft: rgba(36, 86, 224, .09);
    --track: #e8eaef; --free: #18794e; --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101216; --surface: #171a20; --ink: #f0f3f7; --muted: #98a1b1; --line: #262b34;
      --accent: #8ba6ff; --accent-soft: rgba(139, 166, 255, .13); --track: #20252e; --free: #5fce96; }
  }
  /* Apparence forcée depuis l'app (même clé ezh_apparence). */
  html[data-apparence="clair"] { color-scheme: light; }
  html[data-apparence="sombre"] { color-scheme: dark; }
  html[data-apparence="clair"] {
    --bg: #f4f5f7; --surface: #fff; --ink: #17191d; --muted: #626977;
    --line: #e4e7ec; --accent: #2456e0; --accent-soft: rgba(36, 86, 224, .09);
    --track: #e8eaef; --free: #18794e;
  }
  html[data-apparence="sombre"] {
    --bg: #101216; --surface: #171a20; --ink: #f0f3f7; --muted: #98a1b1; --line: #262b34;
    --accent: #8ba6ff; --accent-soft: rgba(139, 166, 255, .13); --track: #20252e; --free: #5fce96;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .mut { color: var(--muted); }
  [hidden] { display: none !important; }

  /* ---------- En-tête (collant) ---------- */
  .top { position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: saturate(1.6) blur(14px); backdrop-filter: saturate(1.6) blur(14px);
    border-bottom: 1px solid var(--line);
    padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
  .top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .retour { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
    color: var(--ink); text-decoration: none; background: var(--surface); border: 1px solid var(--line); flex: none; }
  .titre { flex: 1; min-width: 0; }
  .titre h1 { margin: 0; font-size: 1.15rem; letter-spacing: -.02em; line-height: 1.2; }
  .titre h1 span { color: var(--accent); }
  .titre p { margin: 0; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icone { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; flex: none;
    background: var(--surface); border: 1px solid var(--line); }
  .icone.tourne svg { animation: tourne .8s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .seg { display: flex; background: var(--track); border-radius: 12px; padding: 3px; gap: 2px; }
  .seg button { border: 0; background: none; color: var(--muted); font-weight: 650; font-size: .85rem;
    padding: 7px 12px; border-radius: 9px; min-width: 48px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  @media (max-width: 560px) {
    .top-in > .seg { order: 5; flex: 1 0 100%; }
    .top-in > .seg button { flex: 1; }
  }

  /* ---------- Mise en page ---------- */
  main { max-width: 1180px; margin: 0 auto;
    padding: 16px max(16px, env(safe-area-inset-right)) calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
  .card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 12px; }
  .card-h h2 { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
  .card-h .mut { font-size: .82rem; text-align: right; }
  .grille { display: grid; gap: 12px; margin-top: 12px; }
  @media (min-width: 900px) {
    .grille { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
    .grille > .card:first-child { display: flex; flex-direction: column; }
    .grille .graph { flex: 1; min-height: 180px; }
  }

  #etat { padding: 64px 12px; text-align: center; color: var(--muted); }
  #etat.erreur { color: var(--ink); }
  #etat a { color: var(--accent); }
  .btn { display: inline-block; padding: 12px 20px; border-radius: 12px; background: var(--ink);
    color: var(--bg) !important; text-decoration: none; font-weight: 650; }

  /* ---------- Chiffres clés ---------- */
  .kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .kpi { padding: 14px 16px; }
  .kpi .l { font-size: .8rem; color: var(--muted); font-weight: 600; }
  .kpi b { display: block; font-size: 1.75rem; letter-spacing: -.03em; line-height: 1.15; margin: 2px 0; }
  .kpi .s { font-size: .8rem; color: var(--muted); }
  .kpi .s em { font-style: normal; color: var(--free); font-weight: 650; }

  /* ---------- Alertes (plafonds, purge) ---------- */
  .alerte { margin-top: 12px; border-radius: var(--radius); padding: 12px 16px;
    font-size: .85rem; display: grid; gap: 6px;
    background: color-mix(in srgb, #b47908 10%, var(--surface));
    border: 1px solid color-mix(in srgb, #b47908 38%, var(--line)); }

  /* ---------- Courbe (barres) ---------- */
  .graph { position: relative; height: 180px; display: flex; align-items: stretch; gap: 2px;
    border-bottom: 1px solid var(--line); touch-action: pan-y; }
  .graph .col { flex: 1; display: flex; align-items: flex-end; min-width: 0; cursor: crosshair; }
  .graph .col i { display: block; width: 100%; min-height: 2px; border-radius: 4px 4px 1px 1px;
    background: color-mix(in srgb, var(--accent) 55%, transparent); transition: background .12s; }
  .graph .col.on i, .graph .col.auj i { background: var(--accent); }
  .graph .max { position: absolute; left: 0; right: 0; top: 0; border-top: 1px dashed var(--line);
    font-size: .72rem; color: var(--muted); pointer-events: none; }
  .graph .max span { position: absolute; right: 0; top: -1px; transform: translateY(-100%); padding-bottom: 1px; }
  .axe { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-top: 6px; }
  .infobulle { margin: -4px 0 10px; min-height: 1.4em; font-size: .85rem; }
  .infobulle b { font-variant-numeric: tabular-nums; }

  /* ---------- Formations ---------- */
  .forms { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .forms li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
  .forms .nom { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .forms .val { font-weight: 700; }
  .forms .barre { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .forms .barre i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .forms .det { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); }
  .tag { display: inline-block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; vertical-align: 1px; }
  .plus { display: block; width: 100%; margin-top: 12px; padding: 10px; border-radius: 12px;
    border: 1px solid var(--line); background: none; font-weight: 650; color: var(--accent); }

  /* ---------- Comptes ---------- */
  .comptes { margin-top: 12px; }
  .outils { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .outils input[type=search] { flex: 1 1 240px; min-width: 0; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
  .outils select { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; }
  .puces { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 8px; padding: 0 16px; }
  .puces::-webkit-scrollbar { display: none; }
  .puces button { flex: none; border: 1px solid var(--line); background: none; border-radius: 999px;
    padding: 6px 12px; font-size: .85rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .puces button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .puces button span { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .liste { list-style: none; margin: 0; padding: 0; }
  .ligne, .entete { display: grid; align-items: center; gap: 4px 12px;
    grid-template-columns: 36px minmax(0, 1fr) auto; grid-template-areas: "av qui act" "av cours cours"; }
  .entete { display: none; }
  .liste > li { border-top: 1px solid var(--line); }
  .liste > li:first-child { border-top: 0; }
  .ligne { width: 100%; text-align: left; border: 0; background: none; padding: 12px 0; }
  .av { grid-area: av; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 700; font-size: .9rem; background: var(--accent-soft); color: var(--accent); align-self: start; }
  .av.off { background: var(--track); color: var(--muted); }
  .qui { grid-area: qui; min-width: 0; }
  .qui b, .qui small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qui small { color: var(--muted); font-size: .8rem; }
  .cours { grid-area: cours; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .pil { font-size: .78rem; background: var(--track); border-radius: 6px; padding: 2px 7px; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pil.vide { background: none; color: var(--muted); padding-left: 0; }
  .act { grid-area: act; text-align: right; white-space: nowrap; }
  .act b { display: block; font-variant-numeric: tabular-nums; }
  .act small { color: var(--muted); font-size: .78rem; }
  .c7, .cp, .quand { display: none; }
  .fiche { padding: 0 0 14px 48px; font-size: .85rem; display: grid; gap: 6px; }
  .fiche dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; }
  .fiche dt { color: var(--muted); }
  .fiche dd { margin: 0; overflow-wrap: anywhere; }
  .fiche code { font-size: .78rem; color: var(--muted); }
  .vide-liste { padding: 24px 0; text-align: center; color: var(--muted); }

  @media (min-width: 760px) {
    .ligne, .entete { grid-template-columns: 36px minmax(0, 1.2fr) minmax(0, 1.3fr) 56px 64px 120px;
      grid-template-areas: "av qui cours c7 cp quand"; }
    .entete { display: grid; padding: 0 0 8px; font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); }
    .entete span:nth-child(n+4) { text-align: right; }
    .ligne { padding: 10px 0; border-radius: 10px; }
    .ligne:hover { background: color-mix(in srgb, var(--track) 50%, transparent); }
    .act { display: none; }
    .c7, .cp, .quand { display: block; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .c7 { grid-area: c7; } .cp { grid-area: cp; font-weight: 700; } .quand { grid-area: quand; color: var(--muted); font-size: .85rem; }
    .fiche { padding-left: 48px; }
  }

  /* ---------- Apparence : bouton + menu déroulant (Claire / Sombre / Système) ---------- */
  .theme-wrap { position: relative; flex: none; }
  #btn-apparence svg { display: block; }
  .theme-menu {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 30;
    min-width: 196px; padding: 6px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 20px 44px -14px rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .12);
    transform-origin: top right;
  }
  .theme-menu:not([hidden]) { animation: menu-apparait .18s cubic-bezier(.16,1,.3,1); }
  @keyframes menu-apparait {
    from { opacity: 0; transform: scale(.94) translateY(-4px); }
    to { opacity: 1; transform: none; }
  }
  .theme-opt {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px;
    border: 0; border-radius: 10px; background: none; color: var(--ink); text-align: left;
    font: inherit; font-size: .9rem; font-weight: 550; cursor: pointer;
  }
  .theme-opt:hover, .theme-opt:focus-visible { background: var(--accent-soft); outline: none; }
  .theme-opt > svg { flex: none; color: var(--muted); }
  .theme-opt[aria-checked="true"] { font-weight: 700; }
  .theme-opt .check { margin-left: auto; flex: none; visibility: hidden; }
  .theme-opt[aria-checked="true"] .check { visibility: visible; }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="retour" href="/" aria-label="Retour à l'app">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="titre">
      <h1>Dashboard <span>EzHoraire</span></h1>
      <p id="sous-titre">Chargement…</p>
    </div>
    <div class="seg" role="group" aria-label="Période">
      <button data-j="7" aria-pressed="false">7 j</button>
      <button data-j="30" aria-pressed="true">30 j</button>
      <button data-j="90" aria-pressed="false">90 j</button>
    </div>
    <button class="icone" id="rafraichir" aria-label="Actualiser">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <div class="theme-wrap">
      <button class="icone" id="btn-apparence" type="button" aria-label="Apparence : Système" aria-haspopup="menu" aria-expanded="false">
        <span id="apparence-icone" aria-hidden="true"></span>
      </button>
      <div class="theme-menu" id="menu-apparence" role="menu" aria-label="Apparence" hidden>
        <button class="theme-opt" type="button" role="menuitemradio" data-apparence-opt="clair" aria-checked="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          Claire
          <svg class="check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>
        </button>
        <button class="theme-opt" type="button" role="menuitemradio" data-apparence-opt="sombre" aria-checked="false">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5z"/></svg>
          Sombre
          <svg class="check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>
        </button>
        <button class="theme-opt" type="button" role="menuitemradio" data-apparence-opt="systeme" aria-checked="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg>
          Système
          <svg class="check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</header>

<main>
  <div id="etat">Chargement…</div>
  <div id="contenu" hidden>
    <section class="kpis" id="kpis" aria-label="Chiffres clés"></section>
    <div class="alerte" id="alerte" hidden></div>

    <div class="grille">
      <section class="card">
        <div class="card-h"><h2>Consultations</h2><span class="mut" id="graph-resume"></span></div>
        <div class="infobulle" id="infobulle" aria-live="polite"></div>
        <div class="graph" id="graph" role="img"></div>
        <div class="axe" id="axe"></div>
      </section>
      <section class="card">
        <div class="card-h"><h2>Formations</h2><span class="mut">consultations</span></div>
        <ul class="forms" id="forms"></ul>
        <button class="plus" id="forms-plus" hidden></button>
      </section>
    </div>

    <section class="card comptes">
      <div class="card-h"><h2>Comptes</h2><span class="mut" id="comptes-resume"></span></div>
      <div class="outils">
        <input id="recherche" type="search" placeholder="Email, nom, formation…" aria-label="Rechercher un compte" autocomplete="off">
        <select id="tri" aria-label="Trier">
          <option value="visite">Dernière visite</option>
          <option value="actifs">Plus actifs</option>
          <option value="recents">Plus récents</option>
        </select>
      </div>
      <div class="puces" id="filtres" role="group" aria-label="Filtrer"></div>
      <div class="entete" aria-hidden="true"><span></span><span>Compte</span><span>Horaires</span><span>7 j</span><span>Période</span><span>Dernière visite</span></div>
      <ul class="liste" id="liste"></ul>
      <button class="plus" id="liste-plus" hidden></button>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script>
(function () {
  "use strict";
  var jours = 30, donnees = null, sb = null, requete = 0;
  var vue = { filtre: "tous", tri: "visite", q: "", n: 40, formsTout: false, ouvert: null };
  var $ = function (id) { return document.getElementById(id); };

  function txt(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // L'UMONS préfixe ses formations d'un point ('.BAB1 - Droit') : décapé à l'affichage.
  function joli(f) {
    return String(f == null ? "" : f).replace(/^\s*[.\s]+/, "").replace(/\s+/g, " ").trim();
  }
  // Groupe préfixé par sa formation ('<.BAB1 - Droit>Dr. rom - Gr 1') : on montre la fin.
  function groupe(g) {
    return String(g == null ? "" : g).replace(/^\s*<[^>]*>\s*/, "").replace(/\s+/g, " ").trim();
  }
  function nb(n) { return (+n || 0).toLocaleString("fr-BE"); }
  function date(iso, heure) {
    var d = iso ? new Date(iso) : null;
    if (!d || isNaN(d)) return "—";
    var s = d.toLocaleDateString("fr-BE", { day: "numeric", month: "short", year: "numeric" });
    return heure ? s + " à " + d.toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" }) : s;
  }
  function ilya(iso) {
    var d = iso ? new Date(iso) : null;
    if (!d || isNaN(d)) return "jamais";
    var min = Math.round((Date.now() - d) / 60000);
    if (min < 1) return "à l'instant";
    if (min < 60) return "il y a " + min + " min";
    if (min < 24 * 60) return "il y a " + Math.floor(min / 60) + " h";
    var j = Math.floor(min / 1440);
    if (j === 1) return "hier";
    if (j < 7) return "il y a " + j + " j";
    return d.toLocaleDateString("fr-BE", { day: "numeric", month: "short" });
  }
  function jourCourt(j) {
    return new Date(j + "T12:00:00Z").toLocaleDateString("fr-BE", { day: "numeric", month: "short" });
  }
  function nomDe(u) { return ((u.prenom || "") + " " + (u.nom || "")).trim(); }
  function initiale(u) { return (nomDe(u) || u.email || "?").charAt(0).toUpperCase(); }

  function etat(msg, erreur) {
    var el = $("etat");
    el.hidden = !msg; el.className = erreur ? "erreur" : "";
    el.innerHTML = msg || "";
    $("contenu").hidden = !!msg;
  }

  /* ---------- Chiffres clés ---------- */
  function kpis() {
    var t = donnees.totaux, us = donnees.utilisateurs;
    var limite = Date.now() - jours * 864e5;
    var nouveaux = us.filter(function (u) { return new Date(u.compte_cree) >= limite; }).length;
    var sansHoraire = us.filter(function (u) { return !u.profils.length; }).length;
    var pct = t.comptes ? Math.round(t.visiteurs_uniques / t.comptes * 100) : 0;
    function tuile(l, v, s) {
      return '<div class="card kpi"><div class="l">' + l + '</div><b class="num">' + nb(v) +
        '</b><div class="s">' + s + "</div></div>";
    }
    $("kpis").innerHTML =
      tuile("Comptes", t.comptes, nouveaux ? "<em>+" + nb(nouveaux) + "</em> sur la période" : "aucun nouveau") +
      tuile("Actifs", t.visiteurs_uniques, pct + " % des comptes") +
      tuile("Consultations", t.consultations, nb(t.aujourdhui) + " aujourd'hui") +
      tuile("Horaires suivis", t.horaires_suivis, sansHoraire ? nb(sansHoraire) + " compte" + (sansHoraire > 1 ? "s" : "") + " sans horaire" : "tous les comptes en ont");
  }

  /* ---------- Graphique ---------- */
  function graphique() {
    var serie = donnees.par_jour, n = serie.length;
    var max = Math.max.apply(null, serie.map(function (p) { return p.visites; }).concat([1]));
    var total = serie.reduce(function (s, p) { return s + p.visites; }, 0);
    var g = $("graph");
    g.style.gap = n > 45 ? "1px" : "3px";
    g.innerHTML = '<div class="max"><span>' + nb(max) + "</span></div>" + serie.map(function (p, i) {
      var h = p.visites ? Math.max(2, p.visites / max * 100) : 0;
      return '<div class="col' + (i === n - 1 ? " auj" : "") + '" data-i="' + i + '"><i style="height:' + h + '%"></i></div>';
    }).join("");
    g.setAttribute("aria-label", "Consultations par jour : " + nb(total) + " au total, pic à " + nb(max));
    $("graph-resume").textContent = "moy. " + nb(Math.round(total / Math.max(1, n) * 10) / 10) + " / jour";
    var pas = Math.ceil(n / (window.innerWidth < 560 ? 3 : 5));
    var marques = [];
    for (var i = 0; i < n - 1; i += pas) marques.push(jourCourt(serie[i].jour));
    marques.push("Auj.");
    $("axe").innerHTML = marques.map(function (m) { return "<span>" + txt(m) + "</span>"; }).join("");
    montrer(null);
  }
  function montrer(i) {
    var serie = donnees.par_jour;
    document.querySelectorAll("#graph .col.on").forEach(function (c) { c.classList.remove("on"); });
    if (i == null) {
      var p = serie[serie.length - 1];
      $("infobulle").innerHTML = "Aujourd'hui · <b>" + nb(p.visites) + "</b> consultation" + (p.visites > 1 ? "s" : "") +
        ' <span class="mut">· ' + nb(p.visiteurs) + " visiteur" + (p.visiteurs > 1 ? "s" : "") + "</span>";
      return;
    }
    var q = serie[i];
    var col = document.querySelector('#graph .col[data-i="' + i + '"]');
    if (col) col.classList.add("on");
    $("infobulle").innerHTML = txt(jourCourt(q.jour)) + " · <b>" + nb(q.visites) + "</b> consultation" + (q.visites > 1 ? "s" : "") +
      ' <span class="mut">· ' + nb(q.visiteurs) + " visiteur" + (q.visiteurs > 1 ? "s" : "") + "</span>";
  }
  function survol(e) {
    if (!donnees) return;
    var g = $("graph"), r = g.getBoundingClientRect();
    var n = donnees.par_jour.length;
    var i = Math.floor((e.clientX - r.left) / r.width * n);
    montrer(Math.max(0, Math.min(n - 1, i)));
  }

  /* ---------- Formations ---------- */
  function formations() {
    var fs = donnees.par_formation;
    var max = Math.max.apply(null, fs.map(function (f) { return f.visites; }).concat([1]));
    var montres = vue.formsTout ? fs : fs.slice(0, 6);
    $("forms").innerHTML = montres.map(function (f) {
      return '<li><span class="nom" title="' + txt(f.formation) + '">' +
        (f.ecole ? '<span class="tag">' + txt(f.ecole) + "</span> " : "") + txt(joli(f.formation) || "—") + "</span>" +
        '<span class="val num">' + nb(f.visites) + "</span>" +
        '<span class="barre"><i style="width:' + (f.visites / max * 100) + '%"></i></span>' +
        '<span class="det">' + nb(f.inscrits) + " inscrit" + (f.inscrits > 1 ? "s" : "") +
        " · " + nb(f.visiteurs) + " actif" + (f.visiteurs > 1 ? "s" : "") + "</span></li>";
    }).join("") || '<li class="vide-liste">Aucune donnée.</li>';
    var b = $("forms-plus");
    b.hidden = fs.length <= 6;
    b.textContent = vue.formsTout ? "Réduire" : "Voir les " + fs.length + " formations";
  }

  /* ---------- Comptes ---------- */
  var FILTRES = [
    ["tous", "Tous", function () { return true; }],
    ["actifs", "Actifs 7 j", function (u) { return u.visites_7j > 0; }],
    ["inactifs", "Inactifs", function (u) { return !u.visites_periode; }],
    ["sans", "Sans horaire", function (u) { return !u.profils.length; }],
    ["nouveaux", "Nouveaux", function (u) { return new Date(u.compte_cree) >= Date.now() - jours * 864e5; }]
  ];
  var TRIS = {
    visite: function (a, b) { return (b.derniere_visite || "").localeCompare(a.derniere_visite || ""); },
    actifs: function (a, b) { return b.visites_periode - a.visites_periode || b.visites_7j - a.visites_7j; },
    recents: function (a, b) { return (b.compte_cree || "").localeCompare(a.compte_cree || ""); }
  };
  function puces() {
    var us = donnees.utilisateurs;
    $("filtres").innerHTML = FILTRES.map(function (f) {
      return '<button data-f="' + f[0] + '" aria-pressed="' + (vue.filtre === f[0]) + '">' + f[1] +
        "<span>" + nb(us.filter(f[2]).length) + "</span></button>";
    }).join("");
  }
  function comptes() {
    var test = FILTRES.filter(function (f) { return f[0] === vue.filtre; })[0][2];
    var q = vue.q.toLowerCase().trim();
    var lignes = donnees.utilisateurs.filter(function (u) {
      if (!test(u)) return false;
      if (!q) return true;
      return (u.email + " " + nomDe(u) + " " + u.profils.map(function (p) {
        return p.formation + " " + p.surnom + " " + p.ecole + " " + (p.groupes || []).join(" ");
      }).join(" ")).toLowerCase().indexOf(q) >= 0;
    }).sort(TRIS[vue.tri]);
    $("comptes-resume").textContent = lignes.length === donnees.utilisateurs.length
      ? nb(lignes.length) + " au total" : nb(lignes.length) + " sur " + nb(donnees.utilisateurs.length);
    $("liste").innerHTML = lignes.slice(0, vue.n).map(ligne).join("") ||
      '<li class="vide-liste">Aucun compte ne correspond.</li>';
    var b = $("liste-plus");
    b.hidden = lignes.length <= vue.n;
    b.textContent = "Afficher " + Math.min(40, lignes.length - vue.n) + " de plus";
  }
  function ligne(u) {
    var nom = nomDe(u), ouvert = vue.ouvert === u.user_id;
    var cours = u.profils.length ? u.profils.map(function (p) {
      var g = (p.groupes || []).map(groupe).join(", ");
      return '<span class="pil">' + txt(joli(p.formation) || p.surnom || "—") + (g ? ' <span class="mut">· ' + txt(g) + "</span>" : "") + "</span>";
    }).join("") : '<span class="pil vide">aucun horaire</span>';
    var html = '<li><button class="ligne" data-u="' + txt(u.user_id) + '" aria-expanded="' + ouvert + '">' +
      '<span class="av' + (u.visites_7j ? "" : " off") + '" aria-hidden="true">' + txt(initiale(u)) + "</span>" +
      '<span class="qui"><b>' + txt(nom || u.email || "—") + "</b>" + (nom ? "<small>" + txt(u.email) + "</small>" : "") + "</span>" +
      '<span class="cours">' + cours + "</span>" +
      '<span class="act"><b>' + nb(u.visites_periode) + "</b><small>" + txt(ilya(u.derniere_visite)) + "</small></span>" +
      '<span class="c7">' + nb(u.visites_7j) + "</span>" +
      '<span class="cp">' + nb(u.visites_periode) + "</span>" +
      '<span class="quand">' + txt(ilya(u.derniere_visite)) + "</span></button>";
    if (ouvert) {
      html += '<div class="fiche"><dl>' +
        "<dt>Consultations</dt><dd>" + nb(u.visites_7j) + " sur 7 j · " + nb(u.visites_periode) + " sur " + jours + " j</dd>" +
        "<dt>Dernière visite</dt><dd>" + txt(date(u.derniere_visite, true)) + "</dd>" +
        "<dt>Connexion</dt><dd>" + txt(date(u.derniere_connexion, true)) + "</dd>" +
        "<dt>Compte créé</dt><dd>" + txt(date(u.compte_cree)) + "</dd>" +
        u.profils.map(function (p) {
          return "<dt>" + txt(p.surnom || "Horaire") + "</dt><dd>" + txt(joli(p.formation) || "—") +
            (p.ecole ? ' <span class="tag">' + txt(p.ecole) + "</span>" : "") +
            ((p.groupes || []).length ? '<br><span class="mut">Groupes : ' + txt(p.groupes.map(groupe).join(", ")) + "</span>" : "") + "</dd>";
        }).join("") +
        "<dt>ID</dt><dd><code>" + txt(u.user_id) + "</code></dd></dl></div>";
    }
    return html + "</li>";
  }

  /* ---------- Alertes : plafonds atteints, purge à planifier ---------- */
  function alertes() {
    var msgs = [];
    var lim = donnees.limites || {};
    var quels = [];
    if (lim.comptes) quels.push("comptes (4 000)");
    if (lim.profils) quels.push("horaires (10 000)");
    if (lim.visites) quels.push("consultations (20 000)");
    if (quels.length) {
      msgs.push("Chiffres tronqués — plafond atteint : " + txt(quels.join(", ")) +
        ". Augmente les plafonds dans api/stats.py.");
    }
    var pa = donnees.plus_ancienne_absolue;
    if (pa && !isNaN(new Date(pa))) {
      var age = Math.floor((Date.now() - new Date(pa)) / 864e5);
      if (age > 200) {
        msgs.push("Table visites jamais purgée (données depuis le " + txt(date(pa)) +
          ") : planifie <code>select public.purger_visites(180)</code> " +
          "(pg_cron ou à la main, voir supabase/schema.sql).");
      }
    }
    var el = $("alerte");
    el.hidden = !msgs.length;
    el.innerHTML = msgs.map(function (m) { return "<div>" + m + "</div>"; }).join("");
  }

  function rendre() {
    var maj = new Date().toLocaleTimeString("fr-BE", { hour: "2-digit", minute: "2-digit" });
    $("sous-titre").textContent = jours + " derniers jours · à jour à " + maj;
    kpis(); alertes(); graphique(); formations(); puces(); comptes();
  }

  /* ---------- Données ---------- */
  function charger() {
    var id = ++requete;
    $("rafraichir").classList.add("tourne");
    if (!donnees) etat("Chargement…");
    return sb.auth.getSession().then(function (res) {
      var session = res && res.data && res.data.session;
      if (!session) {
        $("sous-titre").textContent = "Non connecté";
        etat('Connecte-toi d\'abord sur <a href="/">l\'app</a>, puis reviens ici avec le même navigateur.', true);
        return;
      }
      return fetch("api/stats?jours=" + jours, {
        headers: { "Authorization": "Bearer " + session.access_token }, cache: "no-store"
      }).then(function (r) { return r.json(); }).then(function (rep) {
        if (id !== requete) return;
        if (!rep.ok) throw new Error(rep.erreur || "Erreur.");
        donnees = rep.data;
        etat("");
        rendre();
      });
    }).catch(function (e) {
      if (id !== requete) return;
      var msg = (e && e.message) || "Erreur.";
      if (/réservé|403/.test(msg)) msg = "Accès réservé : ce compte n'est pas admin.";
      donnees = null;
      $("sous-titre").textContent = "Erreur";
      etat(txt(msg) + '<br><br><a class="btn" href="/">Retour à l\'app</a>', true);
    }).then(function () {
      if (id === requete) $("rafraichir").classList.remove("tourne");
    });
  }

  /* ---------- Événements ---------- */
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      if (!sb) return;
      jours = +b.getAttribute("data-j");
      document.querySelectorAll(".seg button").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      charger();
    });
  });
  $("rafraichir").addEventListener("click", function () { if (sb) charger(); });
  var g = $("graph");
  g.addEventListener("pointermove", survol);
  g.addEventListener("pointerdown", survol);
  g.addEventListener("pointerleave", function (e) { if (donnees && e.pointerType === "mouse") montrer(null); });
  $("forms-plus").addEventListener("click", function () { vue.formsTout = !vue.formsTout; formations(); });
  $("recherche").addEventListener("input", function (e) { vue.q = e.target.value; vue.n = 40; comptes(); });
  $("tri").addEventListener("change", function (e) { vue.tri = e.target.value; comptes(); });
  $("filtres").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-f]");
    if (!b) return;
    vue.filtre = b.getAttribute("data-f"); vue.n = 40;
    puces(); comptes();
  });
  $("liste").addEventListener("click", function (e) {
    var b = e.target.closest(".ligne");
    if (!b) return;
    var u = b.getAttribute("data-u");
    vue.ouvert = vue.ouvert === u ? null : u;
    comptes();
  });
  $("liste-plus").addEventListener("click", function () { vue.n += 40; comptes(); });
  var largeur = window.innerWidth;
  window.addEventListener("resize", function () {
    if (donnees && (largeur < 560) !== (window.innerWidth < 560)) graphique();
    largeur = window.innerWidth;
  });

  fetch("api/config", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (rep) {
    var s = (rep && rep.supabase) || {};
    if (!s.url || !s.anonKey || !window.supabase) throw new Error("Supabase non configuré.");
    sb = window.supabase.createClient(s.url, s.anonKey);
    return charger();
  }).catch(function (e) {
    $("sous-titre").textContent = "Erreur";
    etat(txt(e.message || "Erreur."), true);
  });
})();
</script>
<script>
/* Apparence (Claire / Sombre / Système, même clé que l'app : ezh_apparence).
   Le bouton de l'en-tête reflète le choix ; la barre du navigateur suit. */
(function () {
  "use strict";
  var CLE = "ezh_apparence";
  var ICONES = {
    clair: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    sombre: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5z"/></svg>',
    systeme: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg>'
  };
  var LIBELLES = { clair: "Claire", sombre: "Sombre", systeme: "Système" };
  function lire() {
    try { var v = localStorage.getItem(CLE); return (v === "clair" || v === "sombre") ? v : "systeme"; }
    catch (e) { return "systeme"; }
  }
  function maj() {
    var clair = document.querySelector('meta[name="theme-color"][media*="light"]');
    var sombre = document.querySelector('meta[name="theme-color"][media*="dark"]');
    var v = lire();
    if (v === "systeme") {
      if (clair) clair.setAttribute("media", "(prefers-color-scheme: light)");
      if (sombre) sombre.setAttribute("media", "(prefers-color-scheme: dark)");
      return;
    }
    var fond = (v === "sombre") ? "#101216" : "#f4f5f7";
    if (clair) { clair.setAttribute("content", fond); clair.setAttribute("media", "all"); }
    if (sombre) sombre.setAttribute("media", "not all");
  }
  function appliquer() {
    var v = lire();
    document.documentElement.setAttribute("data-apparence", v);
    document.getElementById("apparence-icone").innerHTML = ICONES[v];
    document.getElementById("btn-apparence").setAttribute("aria-label", "Apparence : " + LIBELLES[v]);
    var opts = document.querySelectorAll("#menu-apparence [data-apparence-opt]");
    for (var i = 0; i < opts.length; i++) {
      opts[i].setAttribute("aria-checked", opts[i].getAttribute("data-apparence-opt") === v ? "true" : "false");
    }
    maj();
  }
  function fermer() {
    document.getElementById("menu-apparence").hidden = true;
    document.getElementById("btn-apparence").setAttribute("aria-expanded", "false");
  }
  document.getElementById("btn-apparence").addEventListener("click", function () {
    var m = document.getElementById("menu-apparence");
    var ouvre = m.hidden;
    m.hidden = !ouvre;
    this.setAttribute("aria-expanded", ouvre ? "true" : "false");
  });
  document.getElementById("menu-apparence").addEventListener("click", function (e) {
    var b = e.target.closest("[data-apparence-opt]");
    if (!b) return;
    try { localStorage.setItem(CLE, b.getAttribute("data-apparence-opt")); } catch (err) { /* navigation privée */ }
    appliquer();
    fermer();
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".theme-wrap") && !document.getElementById("menu-apparence").hidden) fermer();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("menu-apparence").hidden) fermer();
  });
  appliquer();
  try {
    window.addEventListener("storage", function (e) { if (e.key === CLE) appliquer(); });
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (lire() === "systeme") maj();
      });
    }
  } catch (e) { /* jetable */ }
})();
</script>
</body>
</html>
